name: VIBE Jukebox CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  contracts:
    name: Build & Test Soroban Smart Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Pin ed25519-dalek for Soroban test compatibility
        run: cargo update -p ed25519-dalek:3.0.0 --precise 2.1.1 || true

      - name: Run Soroban Unit Tests
        run: cargo test --verbose

  frontend:
    name: Test & Build Next.js dApp
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm install --legacy-peer-deps

      - name: Run Frontend Tests (Vitest)
        working-directory: ./frontend
        run: npm test

      - name: Build Next.js Production App
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_VIBE_TOKEN_CONTRACT_ID: CD76SQMY64AT4AKTV6VHRF7MMHLC3JPQZ2W4TS57CS4VWE22E4A7G7K6
          NEXT_PUBLIC_JUKEBOX_CONTRACT_ID: CAVVNHZ3JH7M4MHFYVNKTR6BX6VLOUEG7R4DLEAWB26AXIVCMJBBB2QT
          NEXT_PUBLIC_HORIZON_URL: https://horizon-testnet.stellar.org
          NEXT_PUBLIC_SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
        run: npm run build
